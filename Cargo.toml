[workspace]
resolver = "2"
members = [
    "crates/oxitext-core",
    "crates/oxitext-shape",
    "crates/oxitext-layout",
    "crates/oxitext-raster",
    "crates/oxitext-sdf",
    "crates/oxitext-icu",
    "crates/oxitext",
    "crates/oxitext-bench",
]

[workspace.package]
version = "0.1.2"
edition = "2021"
rust-version = "1.89"
authors = ["COOLJAPAN OU (Team Kitasan)"]
license = "Apache-2.0"
repository = "https://github.com/cool-japan/oxitext"
description = "OxiText is the COOLJAPAN Pure-Rust text pipeline: shape → bidi → line-break → layout → rasterize."

[workspace.dependencies]
# workspace internal
oxitext-core   = { path = "crates/oxitext-core",   version = "0.1.2" }
oxitext-shape  = { path = "crates/oxitext-shape",  version = "0.1.2" }
oxitext-layout = { path = "crates/oxitext-layout", version = "0.1.2" }
oxitext-raster = { path = "crates/oxitext-raster", version = "0.1.2" }
oxitext-sdf    = { path = "crates/oxitext-sdf",    version = "0.1.2" }
oxitext-icu    = { path = "crates/oxitext-icu",    version = "0.1.2" }
# external
swash                = { version = "0.2.7" }
fontdue              = { version = "0.9.3" }
unicode-segmentation = { version = "1.13.2" }
unicode-bidi         = { version = "0.3.18" }
unicode-linebreak    = { version = "0.1.5" }
ab_glyph             = { version = "0.2.32" }
rustybuzz            = { version = "0.20.1" }
ttf-parser           = { version = "0.25.1" }
icu_segmenter        = { version = "2.2.0" }
icu_collator         = { version = "2.2.0" }
icu_casemap          = { version = "2.2.0" }
icu_properties       = { version = "2.2.0" }
icu_locale_core      = { version = "2.2.0" }
icu_normalizer       = { version = "2.2.0" }
icu_decimal          = { version = "2.2.0", features = ["compiled_data"] }
icu_list             = { version = "2.2.0", features = ["compiled_data"] }
icu_plurals          = { version = "2.2.0", features = ["compiled_data"] }
fixed_decimal        = { version = "0.7" }
serde                = { version = "1.0", features = ["derive"] }
serde_json           = { version = "1.0" }
wide                 = { version = "1.4.0" }
lru                  = { version = "0.18.0" }
criterion            = { version = "0.8" }
harfbuzz-sys         = { version = "0.6.1" }
pango-sys            = { version = "0.22.0" }
hypher               = { version = "0.1.7" }
rayon                = { version = "1.12.0" }
png                  = { version = "0.18" }
bytemuck             = { version = "1.25.0" }
resvg                = { version = "0.47.0", default-features = false }
tiny-skia            = { version = "0.12.0" }
icu_datetime         = { version = "2.2.0", features = ["compiled_data"] }
smallvec             = { version = "1.15.1" }
# oxifont deps
oxifont                = { version = "0.1.2" }
oxifont-core           = { version = "0.1.2" }
oxifont-parser         = { version = "0.1.2" }
oxifont-bundled        = { version = "0.1.2", features = ["bundled-noto"] }
oxifont-subset         = { version = "0.1.2" }
oxifont-adapter-native = { version = "0.1.2" }
# facade crate (used in workspace-level deps so bench can reference it)
oxitext = { path = "crates/oxitext", version = "0.1.2" }
