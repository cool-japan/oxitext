[workspace]
resolver = "2"
members = [
    "crates/oxitext-swash",
    "crates/oxitext-core",
    "crates/oxitext-shape",
    "crates/oxitext-layout",
    "crates/oxitext-raster",
    "crates/oxitext-sdf",
    "crates/oxitext-icu",
    "crates/oxitext",
    "crates/oxitext-bench",
]

[workspace.package]
version = "0.2.4"
edition = "2021"
rust-version = "1.89"
authors = ["COOLJAPAN OU (Team Kitasan)"]
license = "Apache-2.0"
repository = "https://github.com/cool-japan/oxitext"
description = "OxiText is the COOLJAPAN Pure-Rust text pipeline: shape → bidi → line-break → layout → rasterize."

[workspace.dependencies]
# workspace internal
oxitext-core   = { path = "crates/oxitext-core",   version = "0.2.4" }
oxitext-shape  = { path = "crates/oxitext-shape",  version = "0.2.4" }
oxitext-layout = { path = "crates/oxitext-layout", version = "0.2.4" }
oxitext-raster = { path = "crates/oxitext-raster", version = "0.2.4" }
oxitext-sdf    = { path = "crates/oxitext-sdf",    version = "0.2.4" }
oxitext-icu    = { path = "crates/oxitext-icu",    version = "0.2.4" }
# `swash` is OxiText's own vendored fork, `oxitext-swash` (see
# `crates/oxitext-swash/PROVENANCE.md`). The `package = "oxitext-swash"` alias
# means every consumer keeps writing `use swash::...` unchanged, so the fork is
# a drop-in for upstream and stays trivially comparable with it.
#
# `default-features = false, features = ["std"]` MUST live on this workspace
# line, not on a member's `{ workspace = true }` line: a member's
# `default-features = false` is silently ignored for an inherited dependency.
# This is what keeps `zeno` and `oxiarc-deflate` (only reachable through the
# `scale` feature's PNG/CBDT bitmap path) out of the default OxiText graph.
#
# Consequence for future crates: anything reaching for `swash::scale::*` or
# `swash::zeno::*` must add `features = ["scale", "render"]` to its OWN
# dependency line -- as `oxitext-raster` does -- or it gets a confusing
# "could not find `scale` in `swash`" error.
swash                = { package = "oxitext-swash", path = "crates/oxitext-swash", version = "0.2.4", default-features = false, features = ["std"] }
# Dependencies of the vendored `oxitext-swash`, centralized here per
# CONTRIBUTING.md's workspace-inheritance rule. `skrifa` is pinned at 0.44 --
# the top of upstream swash's `>= 0.31.1, <= 0.44` range and what OxiText
# resolves today -- so a downstream lockfile cannot drift the shaper across 13
# minor versions under us. Raising past the ceiling is a 0.2.3 item.
skrifa               = { version = "0.44", default-features = false }
zeno                 = { version = "0.3.3", default-features = false }
core_maths           = { version = "0.1.1" }
fontdue              = { version = "0.9.3" }
unicode-segmentation = { version = "1.13.3" }
unicode-bidi         = { version = "0.3.18" }
unicode-linebreak    = { version = "0.1.5" }
ab_glyph             = { version = "0.2.32" }
rustybuzz            = { version = "0.20.1" }
ttf-parser           = { version = "0.25.1" }
icu_segmenter        = { version = "2.2.0" }
icu_collator         = { version = "2.2.1" }
icu_casemap          = { version = "2.2.0" }
icu_properties       = { version = "2.2.0" }
icu_locale_core      = { version = "2.2.0" }
icu_normalizer       = { version = "2.2.0" }
icu_decimal          = { version = "2.2.0", features = ["compiled_data"] }
icu_list             = { version = "2.2.0", features = ["compiled_data"] }
icu_plurals          = { version = "2.2.0", features = ["compiled_data"] }
fixed_decimal        = { version = "0.7" }
serde                = { version = "1.0", features = ["derive"] }
serde_json           = { version = "1.0" }
wide                 = { version = "1.5.0" }
lru                  = { version = "0.18.0" }
criterion            = { version = "0.8" }
harfbuzz-sys         = { version = "0.6.1" }
pango-sys            = { version = "0.22.0" }
hypher               = { version = "0.1.7" }
rayon                = { version = "1.12.0" }
# COOLJAPAN pure-Rust compression stack. Used by `oxitext-core`'s PNG encoder
# and PNG decoder so that reading or writing PNG data never drags in the `png`
# crate and, with it, `flate2`/`miniz_oxide` (both banned by `deny.toml`).
oxiarc-core          = { version = "0.4.1" }
oxiarc-deflate       = { version = "0.4.1" }
bytemuck             = { version = "1.25.0" }
resvg                = { version = "0.47.0", default-features = false }
# `default-features = false` drops tiny-skia's `png-format` feature (which
# pulls `png` -> `flate2` -> `miniz_oxide`, banned by `deny.toml`). Neither
# `svg_backend.rs` nor `oxifont_backend.rs` decodes PNG through tiny-skia --
# both only build vector paths (`Pixmap`/`PathBuilder`/`Transform`) -- so
# `std` + `simd` (tiny-skia's other two default features) are sufficient.
# This makes the `oxifont-backend` feature fully free of `png`/`flate2`.
# `svg-backend` stays *not* deny-clean regardless: `resvg` itself declares its
# own `tiny-skia` dependency without `default-features = false`, so Cargo's
# feature unification re-enables `png-format` the moment `resvg` is in the
# graph, and `usvg` (a `resvg` dependency) additionally pulls `flate2`
# directly and unconditionally for `.svgz` support -- see the `svg-backend`
# feature doc comment in `crates/oxitext-raster/Cargo.toml`.
tiny-skia            = { version = "0.12.0", default-features = false, features = ["std", "simd"] }
icu_datetime         = { version = "2.2.0", features = ["compiled_data"] }
smallvec             = { version = "1.15.2" }
# oxifont deps
oxifont                = { version = "0.2.2" }
oxifont-core           = { version = "0.2.2" }
oxifont-parser         = { version = "0.2.2" }
oxifont-bundled        = { version = "0.2.2", features = ["bundled-noto"] }
oxifont-subset         = { version = "0.2.2" }
oxifont-adapter-native = { version = "0.2.2" }
# facade crate (used in workspace-level deps so bench can reference it)
oxitext = { path = "crates/oxitext", version = "0.2.4" }
