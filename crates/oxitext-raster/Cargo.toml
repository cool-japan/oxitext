[package]
name = "oxitext-raster"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"
description = "Fontdue-based glyph rasterizer for OxiText"
keywords = ["text", "rasterizer", "fontdue", "bitmap", "oxitext"]
categories = ["graphics", "rendering"]

[features]
ab-glyph-backend = []
simd             = ["dep:wide"]
swash-backend    = ["dep:swash"]
svg-backend      = ["dep:resvg", "dep:tiny-skia"]
oxifont-backend  = ["dep:oxifont-parser", "dep:oxifont-core", "dep:tiny-skia"]
## Decode PNG-compressed CBDT/CBLC and sbix strikes (color-bitmap emoji fonts
## such as the Apple/Google `NotoColorEmoji` CBDT builds).
##
## Off by default: the `png` crate pulls `flate2` + `miniz_oxide`, both of which
## this repository's own `deny.toml` bans in favour of the `oxiarc-*` stack. All
## other raster paths -- outlines, COLRv0/v1, and the uncompressed CBDT
## mono/gray2/gray4/gray8/BGRA32 strike formats -- are unaffected and stay
## available without this feature.
png-bitmap       = ["dep:png"]

[dependencies]
oxitext-core    = { workspace = true }
fontdue         = { workspace = true }
ttf-parser      = { workspace = true }
ab_glyph        = { workspace = true }
lru             = { workspace = true }
png             = { workspace = true, optional = true }
wide            = { workspace = true, optional = true }
swash           = { workspace = true, optional = true }
resvg           = { workspace = true, optional = true }
tiny-skia       = { workspace = true, optional = true }
oxifont-parser  = { workspace = true, optional = true }
oxifont-core    = { workspace = true, optional = true }

[dev-dependencies]
oxifont-bundled = { workspace = true }
