[package]
name = "oxitext-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"
description = "Core traits and value types for OxiText"
keywords = ["text", "shaping", "layout", "cooljapan", "oxitext"]
categories = ["graphics", "rendering"]

[features]
default = ["std"]
std = []
serde = ["dep:serde"]
## Enables [`png_encode`], a self-contained 8-bit PNG writer built on the
## COOLJAPAN `oxiarc` compression stack (`oxiarc-deflate` for the zlib stream,
## `oxiarc-core` for CRC-32). Deliberately *not* the `png` crate: that one pulls
## `flate2` + `miniz_oxide`, which this repository's `deny.toml` bans.
## Requires `std` because the compressor is a `std` crate.
png-encode = ["std", "dep:oxiarc-core", "dep:oxiarc-deflate"]
## Enables [`png_decode`], the matching PNG reader: full still-image PNG
## support (colour types 0/2/3/4/6, bit depths 1–16, `tRNS`, Adam7 interlace,
## all five scanline filters) normalised to straight-alpha RGBA8, built on the
## same `oxiarc` stack. Used by `oxitext-raster` to decode the PNG-compressed
## `CBDT`/`sbix` strikes of colour-emoji fonts without the `png` crate, which
## would drag in the `deny.toml`-banned flate2/miniz_oxide pair.
## Requires `std` because the decompressor is a `std` crate.
png-decode = ["std", "dep:oxiarc-core", "dep:oxiarc-deflate"]

[dependencies]
serde = { workspace = true, optional = true }
smallvec = { workspace = true }
oxiarc-core = { workspace = true, optional = true }
oxiarc-deflate = { workspace = true, optional = true }

[dev-dependencies]
serde_json = { workspace = true }
